version: 2

models:
  - name: int_snoco__company_attributes
    description: >
      Each record represents one company with its entity-attribute-value
      attributes pivoted to columns. Deduplicated deterministically, because the
      source is not unique on (company_id, attribute_name) and has no usable
      close-out date to filter on.
    columns:
      - name: company_id
        data_tests:
          - unique
          - not_null

  - name: int_snoco__company_identifiers
    description: >
      Each record represents one identifier held by one company, in long form.
      Where the LEI array fan-out guard is applied. See docs/DISCOVERY.md trap 1.
    columns:
      - name: company_id
        data_tests:
          - not_null
      - name: identifier_type
        data_tests:
          - not_null
      - name: identifier_value
        data_tests:
          - not_null

  - name: int_snoco__company_edges
    description: >
      Each record represents one parent-to-child edge, deduplicated to a single
      direction from the source's mirrored storage. 424 rows.
    columns:
      - name: parent_company_id
        data_tests:
          - not_null
      - name: child_company_id
        data_tests:
          - not_null
