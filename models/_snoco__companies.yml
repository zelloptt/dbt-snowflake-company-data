version: 2

models:
  - name: snoco__companies
    description: >
      Each record represents one company, with attributes resolved from the
      entity-attribute-value table and enriched from the SEC filer registry
      where a match exists. 2,918,929 rows, one per company.

      Coverage is thin and that is the dataset rather than a modelling gap:
      ~24% have an address, ~4% an industry group, ~1% an SIC code. There is no
      employee count and no revenue anywhere in the free share.

      Filter country and state on the ISO columns (`country_iso_alpha2`,
      `state_iso_3166_2`). Source country/state are EDGAR state-or-country
      codes, exposed as `edgar_country_code` / `edgar_state_code` and named
      from the shipped SEC list `snoco__edgar_state_country_codes`. See
      docs/DISCOVERY.md trap 8.
    columns:
      - name: company_id
        description: "{{ doc('snoco_company_id') }}"
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: Company name, preferring the spine over the attribute table.
      - name: company_name_normalized
        description: >
          Lowercased, punctuation-stripped, legal-suffix-stripped name used for
          fuzzy matching and blocking. Not for display.
      - name: legal_structure
        description: Legal form, e.g. Corporation, Limited Liability Company.
      - name: ein
        description: "{{ doc('snoco_ein') }}"
      - name: cik
        description: "{{ doc('snoco_cik') }}"
      - name: permid_company_id
        description: "{{ doc('snoco_permid_company_id') }}"
      - name: primary_ticker
        description: Primary exchange ticker.
      - name: sic_code
        description: SIC industry code, preferring the SEC registry over the attribute table.
      - name: sic_description
        description: SIC industry description.
      - name: sic_category
        description: Broad SIC category, SEC registry only.
      - name: sec_industry_group
        description: SEC industry group. Better populated than SIC (~4% vs ~1%).
      - name: is_sec_filer
        description: Whether the company resolves to a row in the SEC filer registry.
      - name: country_iso_alpha2
        description: >
          ISO 3166-1 alpha-2 country code, resolved via the geography index.
          The column to filter on. Source country is an EDGAR state-or-country
          code, not ISO; see edgar_country_code and docs/DISCOVERY.md trap 8.
      - name: country_iso_alpha3
        description: ISO 3166-1 alpha-3 country code, resolved via the geography index.
      - name: country_name
        description: Country name from the geography index, e.g. United States.
      - name: state_iso_3166_2
        description: >
          ISO 3166-2 subdivision code, resolved via the geography index from
          state_geo_id. The column to filter on for state. Source state mixes
          USPS codes with EDGAR codes; see edgar_state_code.
      - name: state_name
        description: Subdivision name from the geography index, e.g. Texas.
      - name: country_geo_id
        description: Geography-index key for the country, from the SEC filer registry.
      - name: state_geo_id
        description: Geography-index key for the state, from the SEC filer registry.
      - name: edgar_country_code
        description: >
          EDGAR state-or-country code from the SEC filer registry, falling back
          to the attribute table. X1 is the United States, E9 Cayman, Z4 Canada.
          Empty strings and the XX/xx unknown placeholder are NULL. Not ISO:
          filter on country_iso_alpha2. Official list:
          https://www.sec.gov/submit-filings/filer-support-resources/edgar-state-country-codes
          See docs/DISCOVERY.md trap 8.
      - name: edgar_state_code
        description: >
          State-or-country code from the SEC filer registry, falling back to the
          attribute table. USPS for US states (TX), EDGAR for others (A8 Quebec,
          E9 Cayman). Empty strings and XX are NULL. Filter on state_iso_3166_2.
      - name: edgar_country_name
        description: >
          English name for edgar_country_code, from the SEC EDGAR list shipped
          as snoco__edgar_state_country_codes. NULL when the code is not on the
          list (the ISO leaks US/FR, for example).
      - name: edgar_state_name
        description: >
          English name for edgar_state_code, from the same SEC list. TX is
          Texas, A8 is Quebec, Canada.
