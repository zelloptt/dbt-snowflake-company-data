version: 2

models:
  - name: snoco__company_match_candidates
    description: >
      Each record represents one plausible company for one of your records,
      with the evidence that produced it. Review surface; join
      snoco__company_match when you want a single answer per input row.

      Disabled unless snoco_matching_enabled is true and snoco__match_source is
      configured.
    columns:
      - name: match_input_id
        description: "{{ doc('snoco_match_input_id') }}"
        data_tests:
          - not_null
      - name: company_id
        description: The candidate company.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('snoco__companies')
                field: company_id
      - name: match_method
        description: How the candidate was found.
        data_tests:
          - accepted_values:
              arguments:
                values: ['domain', 'name']
      - name: match_score
        description: >
          1.0 for a domain match, which is an identity assertion rather than a
          similarity. For a name match, the blended Jaro-Winkler and normalised
          edit distance score on 0..1.
        data_tests:
          - not_null
      - name: match_evidence
        description: The domain or normalised name the candidate was found by.
      - name: candidate_rank
        description: 1 is the best candidate for this input row.
        data_tests:
          - not_null
