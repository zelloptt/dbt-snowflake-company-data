version: 2

models:
  - name: snoco__companies
    description: >
      Each record represents one company, with attributes resolved from the
      entity-attribute-value table and enriched from the SEC filer registry
      where a match exists. 2,918,929 rows, one per company.

      Coverage is thin and that is the dataset rather than a modelling gap:
      ~24% have an address, ~4% an industry group, ~1% an SIC code. There is no
      employee count and no revenue anywhere in the free share.
    columns:
      - name: company_id
        description: Opaque 24-character company key. Primary key.
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: Company name, preferring the spine over the attribute table.
      - name: company_name_normalized
        description: >
          Lowercased, punctuation-stripped, legal-suffix-stripped name used for
          fuzzy matching and blocking. Not for display.
      - name: legal_structure
        description: Legal form, e.g. Corporation, Limited Liability Company.
      - name: ein
        description: US Employer Identification Number.
      - name: cik
        description: SEC Central Index Key.
      - name: permid_company_id
        description: Refinitiv PermID.
      - name: primary_ticker
        description: Primary exchange ticker.
      - name: sic_code
        description: SIC industry code, preferring the SEC registry over the attribute table.
      - name: sic_description
        description: SIC industry description.
      - name: sic_category
        description: Broad SIC category, SEC registry only.
      - name: sec_industry_group
        description: SEC industry group. Better populated than SIC (~4% vs ~1%).
      - name: is_sec_filer
        description: Whether the company resolves to a row in the SEC filer registry.
      - name: country_iso_alpha2
        description: ISO 3166-1 alpha-2 country code, resolved via the geography index.

  - name: snoco__company_identifiers
    description: >
      Each record represents one external identifier held by one company. Long
      rather than wide so a consumer can join on whichever identifier system
      they hold, and because a company can carry several LEIs.
    columns:
      - name: identifier_sk
        description: >
          Surrogate key over (company_id, identifier_type, identifier_value).
          A surrogate rather than a multi-column uniqueness test because
          dbt-core 1.10.6 broke the multi-argument test syntax that
          dbt_utils.unique_combination_of_columns depends on.
        data_tests:
          - unique
          - not_null
      - name: company_id
        description: Foreign key to snoco__companies.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('snoco__companies')
                field: company_id
      - name: identifier_type
        description: The identifier system.
        data_tests:
          - accepted_values:
              arguments:
                values: ['ein', 'cik', 'lei', 'permid_company_id', 'ticker']
      - name: identifier_value
        description: The identifier itself.
        data_tests:
          - not_null

  - name: snoco__company_domains
    description: >
      Each record represents one web domain owned by one company. The most
      useful join key in the package for CRM work, and many-to-many in both
      directions.
    columns:
      - name: company_domain_sk
        description: Surrogate key over (company_id, domain).
        data_tests:
          - unique
          - not_null
      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('snoco__companies')
                field: company_id
      - name: domain
        description: Bare registrable domain.
        data_tests:
          - not_null
      - name: companies_sharing_domain
        description: How many companies the share attributes this domain to.
      - name: is_shared_domain
        description: >
          True when more than one company claims this domain. These are the rows
          that will fan out a naive join, so they are flagged rather than removed.

  - name: snoco__company_hierarchy
    description: >
      Each record represents one company's position on one path through a
      corporate hierarchy.

      Two things to know before using it. It is a DAG, not a tree: 21 companies
      have more than one parent, so company_id is NOT unique here. And it is
      nearly empty, because the free share carries 424 distinct edges against a
      2.9M-company spine, about 0.015% coverage.
    columns:
      - name: company_hierarchy_sk
        description: >
          Surrogate key over the root-to-company path. The grain of this model.
        data_tests:
          - unique
          - not_null
      - name: company_id
        description: >
          The company. Deliberately NOT tested for uniqueness: a company with
          two parents appears on two paths.
        data_tests:
          - not_null
      - name: parent_company_id
        description: Immediate parent on this path. NULL at the root.
      - name: root_company_id
        description: Ultimate parent, reached by walking up to depth 0.
        data_tests:
          - not_null
      - name: depth
        description: Distance from the root. 0 at the root. Observed maximum is 2.
        data_tests:
          - not_null
      - name: hierarchy_path
        description: Root-to-node path of company ids. Also the cycle guard.
      - name: is_ultimate_parent
        description: True when this company is the root of its tree.
      - name: parent_count
        description: How many distinct parents this company has across the whole graph.
      - name: has_multiple_parents
        description: >
          True when the company sits under more than one parent. These are the
          rows that make company_id non-unique, and the ones to resolve
          explicitly if you need a single position per company.

  - name: snoco__company_securities
    description: >
      Each record represents one security issued by one company, with reference
      data resolved through a flattened identifier lookup rather than an
      ARRAY_CONTAINS join predicate.
    columns:
      - name: company_security_sk
        description: Surrogate key over (company_id, security_id_type, security_id).
        data_tests:
          - unique
          - not_null
      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('snoco__companies')
                field: company_id
      - name: security_id_type
        data_tests:
          - not_null
      - name: is_resolved
        description: >
          Whether the security_id resolved to a row in the OpenFIGI or PermID
          reference. False means the share references a security it does not
          also describe, which is a source gap rather than a modelling error.
