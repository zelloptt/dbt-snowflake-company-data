version: 2

models:
  - name: stg_snoco__company_index
    description: >
      Each record represents one company on the Snowflake Public Data (Free)
      spine. Renamed and typed; no other transformation. 2,918,929 rows.
      entity_level and global_tickers are dropped because both are constant or
      empty on every row; see docs/DISCOVERY.md.
    columns:
      - name: company_id
        description: "{{ doc('snoco_company_id') }}"
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: "{{ doc('snoco_company_name') }}"
      - name: lei_array
        description: >
          ARRAY of Legal Entity Identifiers, passed through unflattened. Flatten
          only via int_snoco__company_identifiers, which guards against the
          5,287-element arrays a provider bug attaches to ~1,900 companies.
      - name: ein
        description: "{{ doc('snoco_ein') }}"
      - name: cik
        description: "{{ doc('snoco_cik') }}"
      - name: permid_company_id
        description: "{{ doc('snoco_permid_company_id') }}"
      - name: primary_ticker
        description: Primary exchange ticker. ~0.7% populated.

  - name: stg_snoco__company_characteristics
    description: >
      Each record represents one attribute value for one company. Entity-
      attribute-value, 11.7M rows across 15 attribute names. Not unique on
      (company_id, attribute_name); pivot via int_snoco__company_attributes,
      which deduplicates deterministically.
    columns:
      - name: company_id
        description: "{{ doc('snoco_company_id') }}"
        data_tests:
          - not_null
      - name: attribute_name
        description: One of 15 attribute names. See docs/DISCOVERY.md.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - company_name
                  - company_legal_structure
                  - permid_company_id
                  - cik
                  - ein
                  - lei
                  - sic_code
                  - sic_description
                  - sec_industry_group
                  - business_address_line1
                  - business_address_line2
                  - business_address_city
                  - business_address_state
                  - business_address_zip
                  - business_address_country
      - name: attribute_value
        description: The attribute value. Always text, whatever the attribute.
      - name: observed_from_date
        description: "{{ doc('snoco_observed_from_date') }}"

  - name: stg_snoco__company_domains
    description: >
      Each record represents one web domain attributed to one company, with the
      domain normalised to a bare registrable form. 319,269 rows.
    columns:
      - name: company_id
        description: "{{ doc('snoco_company_id') }}"
        data_tests:
          - not_null
      - name: domain
        description: "{{ doc('snoco_domain') }}"
      - name: domain_raw
        description: The domain exactly as the share supplies it.

  - name: stg_snoco__company_relationships
    description: >
      Each record represents one direction of one corporate relationship. 848
      rows describing 424 edges, each stored as both Parent and Subsidiary.
      Self-edges are excluded so the recursive hierarchy cannot loop.
    columns:
      - name: company_id
        data_tests:
          - not_null
      - name: related_company_id
        data_tests:
          - not_null
      - name: relationship_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Parent', 'Subsidiary']

  - name: stg_snoco__sec_filers
    description: >
      Each record represents one SEC filer. 981,128 rows, unique on cik.
      28.7% carry a NULL company_id and cannot be joined to the spine; they are
      kept here deliberately so this model remains the complete filer universe.
    columns:
      - name: cik
        description: "{{ doc('snoco_cik') }}"
        data_tests:
          - unique
          - not_null
      - name: company_id
        description: >
          Foreign key to stg_snoco__company_index, NULL on 28.7% of rows.
          Deliberately not tested for not_null.
      - name: sic_code
        description: >
          SIC industry code, from the source column named `sic`. Not to be
          confused with the `sic_code` attribute in company_characteristics.

  - name: stg_snoco__company_securities
    description: >
      Each record represents one security attributed to one company. 985,971
      rows. security_id is type-qualified by security_id_type.
    columns:
      - name: company_id
        data_tests:
          - not_null
      - name: security_id
        data_tests:
          - not_null
      - name: security_id_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - openfigi_figi_id
                  - openfigi_composite_id
                  - openfigi_share_class_id
                  - permid_quote_id
                  - permid_security_id

  - name: stg_snoco__openfigi_securities
    description: >
      Each record represents one OpenFIGI security reference. 119,273 rows.
      Identifier columns are ARRAYs and are flattened downstream.
    columns:
      - name: openfigi_id
        data_tests:
          - unique
          - not_null

  - name: stg_snoco__permid_securities
    description: Each record represents one PermID security reference. 25,751 rows.
    columns:
      - name: permid_security_id
        data_tests:
          - unique
          - not_null

  - name: stg_snoco__geographies
    description: >
      Each record represents one geographic entity, from country down to census
      block group, with ISO codes. 573,277 rows.
    columns:
      - name: geo_id
        data_tests:
          - unique
          - not_null
      - name: geo_level
        description: Granularity of the entity, e.g. Country, State, Zip.
