# Keep this short. Every dependency is a resolution constraint we impose on
# every consumer of this package.
#
# dbt_expectations is here so data tests are declared in YAML rather than as
# hand-written singular tests. See DECISIONLOG.md. It brings
# godatadriven/dbt_date transitively.
#
# Rules for any dependency:
#   - install from the dbt Package Hub, not git, so dbt can deduplicate
#   - use the widest version range that works
#   - never pin to a patch version unless a specific incompatibility is known

packages:
  # metaplane is the maintained fork; calogica/dbt_expectations redirects to
  # it on the hub and stopped at 0.10.4.
  - package: metaplane/dbt_expectations
    version: [">=0.10.0", "<0.11.0"]
