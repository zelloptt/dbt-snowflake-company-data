name: 'snowflake_company_data'
version: '0.1.0'
config-version: 2

# The <3.0.0 ceiling is deliberate. The dbt Fusion engine reports itself as
# version 2.x, so a <2.0.0 ceiling costs the Fusion-compatible badge on the
# dbt Package Hub and makes Fusion warn (and eventually error) on install.
# Do not narrow this without reading RELEASE.md first.
require-dbt-version: [">=1.10.0", "<3.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

vars:
  snowflake_company_data:

    # ------------------------------------------------------------------
    # Source location
    #
    # snoco_database is deliberately NOT declared here. If a package declares
    # a var as null in its own dbt_project.yml, var('snoco_database', default)
    # resolves to null rather than falling back, because the var IS defined.
    # Leaving it undeclared lets the var() default in the sources file work.
    # It is never target.database: the data lives in a separate database from
    # the user's build database, whether that is the Marketplace share itself
    # or a local replica of it.
    #
    # Both defaults describe Zello's own deployment, which reads a daily
    # replica rather than the share directly. EVERY OTHER CONSUMER MUST SET
    # BOTH. There is no default that works unconfigured, because the share's
    # database name is chosen at CREATE DATABASE ... FROM LISTING time and is
    # different in every account. See README "Configure".
    # ------------------------------------------------------------------
    snoco_schema: 'SNOWFLAKE_COMPANY_DATA'

    # ------------------------------------------------------------------
    # Source relations
    #
    # One var per source object, each defaulting to the declared source. Any
    # single table can be repointed at an arbitrary relation without touching
    # package code, which is what lets the integration test project swap every
    # source for a synthetic seed.
    #
    # This is the pattern Fivetran's packages use, and the reason to copy it
    # rather than pass identifiers is that a whole relation covers the cases an
    # identifier cannot: a table in a different database, a view, a seed.
    #
    # Verified, because it looks like it should break lineage and does not: the
    # source() call is rendered in the consuming model's context, so dbt still
    # records source.snowflake_company_data.snoco.<table> in depends_on. The
    # DAG is identical to a direct source() reference.
    # ------------------------------------------------------------------
    snoco_company_index:                 "{{ source('snoco', 'company_index') }}"
    snoco_company_characteristics:       "{{ source('snoco', 'company_characteristics') }}"
    snoco_company_domain_relationships:  "{{ source('snoco', 'company_domain_relationships') }}"
    snoco_company_relationships:         "{{ source('snoco', 'company_relationships') }}"
    snoco_company_security_relationships: "{{ source('snoco', 'company_security_relationships') }}"
    snoco_sec_cik_index:                 "{{ source('snoco', 'sec_cik_index') }}"
    snoco_openfigi_security_index:       "{{ source('snoco', 'openfigi_security_index') }}"
    snoco_permid_security_index:         "{{ source('snoco', 'permid_security_index') }}"
    snoco_geography_index:               "{{ source('snoco', 'geography_index') }}"

    # ------------------------------------------------------------------
    # Enablement flags (single underscore)
    # ------------------------------------------------------------------
    snoco_company_enabled: true
    snoco_sec_enabled: true
    snoco_securities_enabled: true
    snoco_geography_enabled: true
    snoco_matching_enabled: false

    # ------------------------------------------------------------------
    # User-facing configuration (double underscore)
    #
    # The nulls and empty lists below are intentional "not configured"
    # sentinels, unlike snoco_database above. Because they are declared,
    # var('x', fallback) will NOT fall back for them. Resolve them by
    # truthiness in Jinja or via a macro, never via a var() default.
    # ------------------------------------------------------------------
    snoco__characteristic_types: []
    snoco__legal_suffixes: []
    snoco__match_source: null
    snoco__match_id_column: null
    snoco__match_name_column: 'company_name'
    snoco__match_domain_column: null
    snoco__match_ticker_column: null
    snoco__match_min_score: 0.90
    snoco__match_max_candidates: 5

    # A winner whose runner-up scored within this margin is flagged
    # is_ambiguous in snoco__company_match. It does not change which row wins,
    # it marks the rows where the win was close enough to be worth checking.
    snoco__match_ambiguity_margin: 0.02
    snoco__hierarchy_max_depth: 10

    # Identifier arrays in COMPANY_INDEX are mostly single-valued, but a
    # provider-side grouping bug gives 230 companies a shared LEI array, the
    # largest holding 5,287 entries and carried verbatim by 47 different
    # companies. Flattening those unguarded adds 270,001 rows that assert
    # ownership of identifiers the company does not hold. Arrays longer than
    # this are dropped rather than fanned out, and a warn-severity test reports
    # how many. See docs/DISCOVERY.md trap 1.
    snoco__max_identifier_array_size: 25

    # ------------------------------------------------------------------
    # Engine escape hatch
    # Set true in the Fusion CI lane to skip resources Fusion cannot parse.
    # ------------------------------------------------------------------
    deactivate_for_fusion: false

# Layout follows the shape the ecosystem has settled on, most visibly in
# Fivetran's packages: marts live directly in models/, staging and intermediate
# in subdirectories. Anything at the root of models/ is a model this package
# publishes and a consumer may reference; everything below it is plumbing.
#
# No models/staging/tmp/ layer. Fivetran's exists to give
# fill_staging_columns a relation to introspect and to union multiple
# connectors. We do neither: there is one share, every consumer reads the same
# objects, and CLAUDE.md ground rule 7 rejects the schema-drift shim outright.
# A tmp layer here would be indirection with nothing on the other end.
models:
  snowflake_company_data:
    +materialized: table
    +schema: snowflake_company_data
    staging:
      # Views, not tables. Fivetran materialises staging because theirs unpacks,
      # casts and back-fills missing columns. Ours is a rename and a cast over a
      # source that is already materialised, so a table would be a second copy
      # of 16M rows earning nothing.
      +materialized: view
      +schema: stg_snowflake_company_data
    intermediate:
      +materialized: ephemeral
