# The job name must stay `integration-tests`: branch protection on main requires
# a status check by exactly that name, and renaming it silently blocks every PR.
name: integration-tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.10.8 is the declared floor and is not arbitrary: the package's
        # generic tests nest under `arguments:`, which 1.10.7 rejects. Testing
        # the floor is the point, because that bug shipped once already.
        dbt-version: ["1.10.8", "1.12.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt ${{ matrix.dbt-version }}
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==${{ matrix.dbt-version }}" "dbt-snowflake~=1.10"
      - name: dbt deps
        working-directory: integration_tests
        run: dbt deps --profiles-dir ./ci
      - name: dbt build
        working-directory: integration_tests
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          DBT_ENV_SECRET_SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: dbt build --profiles-dir ./ci --full-refresh
      - name: Drop the run's schema
        if: always()
        working-directory: integration_tests
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          DBT_ENV_SECRET_SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: dbt run-operation drop_ci_schema --profiles-dir ./ci || true
